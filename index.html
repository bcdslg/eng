<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>儿童英语单词卡</title>
  <style>
    :root {
      --ink: #243042;
      --muted: #657286;
      --paper: #fffdf7;
      --line: rgba(36, 48, 66, 0.12);
      --shadow: 0 12px 30px rgba(52, 69, 96, 0.12);
      --shadow-soft: 0 8px 18px rgba(52, 69, 96, 0.1);
      --blue: #78b7ff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at 12% 16%, rgba(255, 212, 107, 0.28), transparent 28%),
        radial-gradient(circle at 85% 10%, rgba(120, 183, 255, 0.24), transparent 30%),
        linear-gradient(135deg, #fff8e8 0%, #edf9ff 48%, #fff0f5 100%);
    }

    button,
    input {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 max(34px, env(safe-area-inset-bottom));
    }

    header {
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.78);
      border-radius: 22px;
      background: rgba(255, 253, 247, 0.84);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 3.2vw, 2.9rem);
      line-height: 1.15;
      letter-spacing: 0;
    }

    .mascot {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      width: 62px;
      height: 62px;
      border-radius: 18px;
      font-size: 1.55rem;
      font-weight: 900;
      background: linear-gradient(135deg, #fff6b8, #aee8ff);
      box-shadow: inset 0 -5px 0 rgba(36, 48, 66, 0.08);
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(210px, 360px) 1fr;
      gap: 16px;
      align-items: start;
    }

    .search-wrap {
      position: relative;
    }

    .search-wrap span {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.15rem;
      pointer-events: none;
    }

    input[type="search"] {
      width: 100%;
      min-height: 48px;
      border: 2px solid rgba(120, 183, 255, 0.44);
      border-radius: 16px;
      padding: 0 16px 0 46px;
      color: var(--ink);
      background: white;
      font-size: 1rem;
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    input[type="search"]:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(120, 183, 255, 0.2);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .filter-btn {
      min-height: 42px;
      border: 0;
      border-radius: 999px;
      padding: 0 15px;
      color: #2b3445;
      background: white;
      box-shadow: inset 0 0 0 1px var(--line), var(--shadow-soft);
      font-weight: 700;
      cursor: pointer;
      transition: transform 150ms ease, box-shadow 150ms ease, background 150ms ease;
      touch-action: manipulation;
      white-space: nowrap;
    }

    .filter-btn:hover {
      transform: translateY(-2px);
      box-shadow: inset 0 0 0 1px rgba(36, 48, 66, 0.15), 0 10px 20px rgba(52, 69, 96, 0.14);
    }

    .filter-btn.active {
      background: #243042;
      color: white;
      box-shadow: 0 10px 20px rgba(36, 48, 66, 0.2);
    }

    main {
      margin-top: 24px;
    }

    .category-section {
      margin-bottom: 28px;
    }

    .category-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 13px;
      font-size: 1.35rem;
    }

    .category-title .badge {
      display: inline-grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 13px;
      background: white;
      box-shadow: var(--shadow-soft);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
      gap: 16px;
    }

    .card {
      position: relative;
      min-height: 164px;
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, 0.78);
      border-radius: 22px;
      overflow: hidden;
      background: var(--card-bg, white);
      box-shadow: var(--shadow-soft);
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .card::after {
      content: "";
      position: absolute;
      right: -24px;
      bottom: -30px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.45);
      pointer-events: none;
    }

    .card:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 16px 30px rgba(52, 69, 96, 0.16);
    }

    .word-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      position: relative;
      z-index: 1;
    }

    .chinese {
      margin: 0;
      font-size: 1.42rem;
      font-weight: 800;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .speak-btn {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: inset 0 0 0 1px rgba(36, 48, 66, 0.1);
      cursor: pointer;
      font-size: 1.1rem;
      transition: transform 140ms ease, background 140ms ease;
      touch-action: manipulation;
    }

    .speak-btn:hover {
      transform: scale(1.08);
      background: white;
    }

    .speak-btn:active {
      transform: scale(0.95);
    }

    .english {
      position: relative;
      z-index: 1;
      margin: 18px 0 8px;
      font-size: 1.22rem;
      font-weight: 800;
      color: #152033;
      overflow-wrap: anywhere;
    }

    .pronunciation {
      position: relative;
      z-index: 1;
      margin: 0;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .empty {
      display: none;
      padding: 34px 18px;
      border-radius: 22px;
      text-align: center;
      background: rgba(255, 253, 247, 0.82);
      box-shadow: var(--shadow-soft);
      color: var(--muted);
      font-size: 1.05rem;
    }

    .footer {
      position: sticky;
      bottom: max(16px, env(safe-area-inset-bottom));
      width: max-content;
      max-width: calc(100vw - 32px);
      margin: 28px auto 0;
      padding: 12px 22px;
      border-radius: 999px;
      background: rgba(36, 48, 66, 0.92);
      color: white;
      box-shadow: var(--shadow);
      font-weight: 800;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .study-modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      place-items: center;
      padding: 18px;
      background: rgba(24, 32, 46, 0.55);
      backdrop-filter: blur(14px);
    }

    .study-modal.open {
      display: grid;
    }

    .study-panel {
      position: relative;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      width: min(520px, 100%);
      min-height: min(720px, calc(100vh - 36px));
      border-radius: 28px;
      overflow: hidden;
      background: linear-gradient(135deg, #fff7c8, #ddf7ff);
      box-shadow: 0 26px 60px rgba(10, 20, 35, 0.28);
      touch-action: pan-y;
    }

    .study-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 16px 0;
    }

    .study-category,
    .study-count {
      font-weight: 900;
      color: rgba(36, 48, 66, 0.76);
    }

    .study-close {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.8);
      color: var(--ink);
      font-size: 1.35rem;
      font-weight: 900;
      cursor: pointer;
      touch-action: manipulation;
    }

    .study-card {
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 18px;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 22px 28px 30px;
      text-align: center;
      will-change: transform, opacity;
      scrollbar-width: none;
    }

    .study-card::-webkit-scrollbar {
      display: none;
    }

    .study-card.slide-next {
      animation: slideNext 220ms ease-out;
    }

    .study-card.slide-prev {
      animation: slidePrev 220ms ease-out;
    }

    .study-art {
      position: relative;
      display: grid;
      place-items: center;
      width: min(210px, 48vw);
      aspect-ratio: 1;
      border-radius: 28px;
      overflow: hidden;
      background:
        radial-gradient(circle at 23% 24%, rgba(255, 179, 207, 0.84) 0 10%, transparent 11%),
        radial-gradient(circle at 78% 24%, rgba(143, 220, 141, 0.72) 0 13%, transparent 14%),
        radial-gradient(circle at 78% 76%, rgba(120, 183, 255, 0.7) 0 10%, transparent 11%),
        linear-gradient(135deg, #ffffff 0%, #fff4bd 54%, #cdeeff 100%);
      box-shadow: 0 16px 22px rgba(36, 48, 66, 0.16);
      user-select: none;
    }

    .study-art::after {
      content: "";
      position: absolute;
      left: 18%;
      right: 18%;
      bottom: 20%;
      height: 10px;
      border-radius: 999px;
      background: rgba(36, 48, 66, 0.08);
    }

    .study-art-emoji {
      position: relative;
      z-index: 1;
      font-size: clamp(4.5rem, 21vw, 7rem);
      line-height: 1;
      filter: drop-shadow(0 8px 8px rgba(36, 48, 66, 0.16));
    }

    .study-art-label {
      position: absolute;
      left: 16%;
      right: 16%;
      bottom: 11%;
      z-index: 2;
      min-height: 28px;
      border-radius: 999px;
      padding: 5px 8px;
      background: rgba(255, 255, 255, 0.86);
      color: var(--ink);
      font-size: 0.92rem;
      font-weight: 900;
      line-height: 1.2;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .study-chinese {
      margin: 0;
      font-size: clamp(2.35rem, 11vw, 4.6rem);
      line-height: 1.05;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .study-english {
      margin: 0;
      font-size: clamp(2.1rem, 10vw, 4.4rem);
      line-height: 1.08;
      font-weight: 900;
      color: #142135;
      overflow-wrap: anywhere;
    }

    .study-pronunciation {
      margin: 0;
      color: var(--muted);
      font-size: clamp(1.05rem, 4vw, 1.55rem);
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .study-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 8px;
    }

    .study-speak {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 104px;
      min-height: 56px;
      border: 0;
      border-radius: 999px;
      padding: 0 16px;
      background: white;
      box-shadow: var(--shadow-soft);
      color: var(--ink);
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      touch-action: manipulation;
    }

    .study-nav {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 56px 1fr 56px;
      align-items: center;
      gap: 12px;
      padding: 0 18px max(18px, env(safe-area-inset-bottom));
    }

    .study-arrow {
      display: grid;
      place-items: center;
      width: 56px;
      height: 56px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.82);
      color: var(--ink);
      box-shadow: var(--shadow-soft);
      font-size: 2rem;
      font-weight: 900;
      cursor: pointer;
      touch-action: manipulation;
    }

    .study-hint {
      margin: 0;
      color: rgba(36, 48, 66, 0.68);
      text-align: center;
      font-size: 0.95rem;
      font-weight: 700;
    }

    @keyframes slideNext {
      from {
        opacity: 0;
        transform: translateX(42px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    @keyframes slidePrev {
      from {
        opacity: 0;
        transform: translateX(-42px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    @media (hover: none) {
      .card:hover,
      .filter-btn:hover {
        transform: none;
      }
    }

    @media (max-width: 760px) {
      .app {
        width: min(100% - 22px, 1180px);
        padding-top: 14px;
      }

      header {
        padding: 18px;
        border-radius: 18px;
      }

      .title-row {
        align-items: flex-start;
        margin-bottom: 16px;
      }

      .mascot {
        width: 50px;
        height: 50px;
        border-radius: 15px;
        font-size: 1.2rem;
      }

      .controls {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .filters {
        flex-wrap: nowrap;
        gap: 8px;
        margin-inline: -18px;
        padding: 2px 18px 8px;
        overflow-x: auto;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }

      .filters::-webkit-scrollbar {
        display: none;
      }

      .filter-btn {
        min-height: 44px;
        padding: 0 14px;
        font-size: 0.94rem;
      }

      .category-title {
        font-size: 1.18rem;
      }

      .grid {
        grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
        gap: 12px;
      }

      .card {
        min-height: 152px;
        padding: 15px;
        border-radius: 18px;
      }

      .chinese {
        font-size: 1.25rem;
      }

      .english {
        font-size: 1.08rem;
      }
    }

    @media (max-width: 480px) {
      .app {
        width: min(100% - 18px, 1180px);
      }

      h1 {
        font-size: 1.52rem;
      }

      .mascot {
        display: none;
      }

      input[type="search"] {
        min-height: 46px;
        font-size: 0.98rem;
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .card {
        min-height: 146px;
        padding: 13px;
      }

      .word-top {
        gap: 8px;
      }

      .speak-btn {
        width: 40px;
        height: 40px;
      }

      .chinese {
        font-size: 1.12rem;
      }

      .english {
        margin-top: 16px;
        font-size: 1rem;
      }

      .pronunciation {
        font-size: 0.88rem;
      }

      .footer {
        max-width: calc(100vw - 18px);
        padding: 11px 18px;
        font-size: 0.95rem;
      }

      .study-modal {
        padding: 10px;
      }

      .study-panel {
        min-height: calc(100dvh - 20px);
        max-height: calc(100dvh - 20px);
        border-radius: 24px;
      }

      .study-card {
        align-content: start;
        gap: 10px;
        padding: 8px 18px 14px;
      }

      .study-art {
        width: min(138px, 36vw);
        border-radius: 24px;
      }

      .study-art-emoji {
        font-size: clamp(3.7rem, 17vw, 5rem);
      }

      .study-art-label {
        font-size: 0.78rem;
        min-height: 23px;
        padding: 4px 7px;
      }

      .study-chinese {
        font-size: clamp(1.9rem, 9vw, 3.2rem);
      }

      .study-english {
        font-size: clamp(1.45rem, 7.5vw, 2.65rem);
      }

      .study-pronunciation {
        font-size: clamp(0.95rem, 3.5vw, 1.25rem);
      }

      .study-speak {
        min-width: 96px;
        min-height: 52px;
      }

      .study-nav {
        padding-bottom: max(22px, env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title-row">
        <h1>儿童英语单词卡 - 家中物品</h1>
        <div class="mascot" aria-hidden="true">ABC</div>
      </div>
      <div class="controls">
        <label class="search-wrap" for="searchInput">
          <span aria-hidden="true">🔎</span>
          <input id="searchInput" type="search" placeholder="搜索中文或英文，比如 apple / 苹果">
        </label>
        <nav class="filters" id="filters" aria-label="单词分类"></nav>
      </div>
    </header>

    <main id="wordList"></main>
    <div class="empty" id="emptyState">没有找到匹配的单词，换个关键词试试看。</div>
    <div class="footer" id="countText">共 0 个单词</div>
  </div>

  <div class="study-modal" id="studyModal" aria-hidden="true">
    <section class="study-panel" id="studyPanel" role="dialog" aria-modal="true" aria-label="单词学习卡片">
      <div class="study-topbar">
        <span class="study-category" id="studyCategory"></span>
        <button class="study-close" id="studyClose" type="button" aria-label="关闭">×</button>
      </div>
      <div class="study-card">
        <div class="study-art" id="studyArt" aria-hidden="true">
          <span class="study-art-emoji" id="studyArtEmoji">⭐</span>
          <span class="study-art-label" id="studyArtLabel"></span>
        </div>
        <p class="study-chinese" id="studyChinese"></p>
        <p class="study-english" id="studyEnglish"></p>
        <p class="study-pronunciation" id="studyPronunciation"></p>
        <div class="study-actions">
          <button class="study-speak" id="studySpeak" type="button" aria-label="朗读当前英文单词">🔊 英文</button>
          <button class="study-speak" id="studySpeakChinese" type="button" aria-label="朗读当前中文单词">🔊 中文</button>
        </div>
      </div>
      <div class="study-nav">
        <button class="study-arrow" id="studyPrev" type="button" aria-label="上一个单词">‹</button>
        <p class="study-hint"><span id="studyCount"></span>　左右滑动切换</p>
        <button class="study-arrow" id="studyNext" type="button" aria-label="下一个单词">›</button>
      </div>
    </section>
  </div>

  <script>
    const categories = [
      {
        name: "水果蔬菜",
        icon: "🍎",
        color: "linear-gradient(135deg, #fff0c4, #d9f7b7)",
        words: [
          ["苹果", "apple", "ˈæpəl"],
          ["香蕉", "banana", "bəˈnænə"],
          ["橙子", "orange", "ˈɔrɪndʒ"],
          ["草莓", "strawberry", "ˈstrɔˌberi"],
          ["葡萄", "grape", "ɡreɪp"],
          ["西瓜", "watermelon", "ˈwɔtərˌmɛlən"],
          ["菠萝", "pineapple", "ˈpaɪnˌæpəl"],
          ["梨", "pear", "per"],
          ["桃子", "peach", "pitʃ"],
          ["樱桃", "cherry", "ˈtʃeri"],
          ["柠檬", "lemon", "ˈlɛmən"],
          ["胡萝卜", "carrot", "ˈkærət"],
          ["西兰花", "broccoli", "ˈbrɑkəli"],
          ["番茄", "tomato", "təˈmeɪtoʊ"],
          ["黄瓜", "cucumber", "ˈkjuˌkʌmbər"],
          ["土豆", "potato", "pəˈteɪtoʊ"],
          ["洋葱", "onion", "ˈʌnjən"],
          ["生菜", "lettuce", "ˈlɛtɪs"],
          ["玉米", "corn", "kɔrn"],
          ["蘑菇", "mushroom", "ˈmʌʃrum"],
          ["南瓜", "pumpkin", "ˈpʌmpkɪn"],
          ["蓝莓", "blueberry", "ˈbluˌberi"],
          ["芒果", "mango", "ˈmæŋɡoʊ"],
          ["猕猴桃", "kiwi", "ˈkiwi"],
          ["豌豆", "peas", "piz"],
          ["菠菜", "spinach", "ˈspɪnɪtʃ"],
          ["卷心菜", "cabbage", "ˈkæbɪdʒ"],
          ["大蒜", "garlic", "ˈɡɑrlɪk"],
          ["辣椒", "pepper", "ˈpɛpər"]
        ]
      },
      {
        name: "玩具",
        icon: "🧸",
        color: "linear-gradient(135deg, #ffe0eb, #dff3ff)",
        words: [
          ["玩具熊", "teddy bear", "ˈtɛdi ber"],
          ["积木", "blocks", "blɑks"],
          ["拼图", "puzzle", "ˈpʌzəl"],
          ["洋娃娃", "doll", "dɑl"],
          ["玩具车", "toy car", "tɔɪ kɑr"],
          ["球", "ball", "bɔl"],
          ["跳绳", "jump rope", "dʒʌmp roʊp"],
          ["风筝", "kite", "kaɪt"],
          ["沙包", "beanbag", "ˈbinˌbæɡ"],
          ["玩偶", "puppet", "ˈpʌpɪt"],

    function normalize(text) {
      return String(text).trim().toLowerCase();
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function getSpeakText(english) {
      return english.replace(/\s*\/.*$/, "").trim();
    }

    function getWordEmoji(word) {
      const primaryEnglish = getSpeakText(word.english).toLowerCase();
      return wordEmoji[primaryEnglish] || categoryEmoji[word.category] || "⭐";
    }

    function createFilterButtons() {
      const names = ["全部", ...categories.map(category => category.name)];
      filtersEl.innerHTML = names.map(name => {
        const category = categories.find(item => item.name === name);
        const label = name === "全部" ? "🌟 全部" : `${category.icon} ${category.name}`;
        return `<button class="filter-btn${name === state.selectedCategory ? " active" : ""}" type="button" data-category="${escapeHtml(name)}">${label}</button>`;
      }).join("");
    }

    function getVisibleCategories() {
      const query = normalize(state.query);
      return categories
        .filter(category => state.selectedCategory === "全部" || category.name === state.selectedCategory)
        .map(category => {
          const words = category.words.filter(([chinese, english, pronunciation]) => {
            const haystack = normalize(`${chinese} ${english} ${pronunciation}`);
            return !query || haystack.includes(query);
          });
          return { ...category, words };
        })
        .filter(category => category.words.length > 0);
    }

    function flattenVisibleWords(visibleCategories) {
      return visibleCategories.flatMap(category =>
        category.words.map(([chinese, english, pronunciation]) => ({
          category: category.name,
          icon: category.icon,
          color: category.color,
          chinese,
          english,
          pronunciation
        }))
      );
    }

    function renderWords() {
      createFilterButtons();
      const visibleCategories = getVisibleCategories();
      visibleWords = flattenVisibleWords(visibleCategories);
      let total = 0;
      let cardIndex = 0;

      listEl.innerHTML = visibleCategories.map(category => {
        total += category.words.length;
        const cards = category.words.map(([chinese, english, pronunciation]) => {
          const index = cardIndex;
          cardIndex += 1;
          return `
          <article class="card" style="--card-bg: ${category.color}" data-index="${index}">
            <div class="word-top">
              <p class="chinese">${escapeHtml(chinese)}</p>
              <button class="speak-btn" type="button" data-word="${escapeHtml(english)}" aria-label="朗读 ${escapeHtml(english)}" title="朗读 ${escapeHtml(english)}">🔊</button>
            </div>
            <p class="english">${escapeHtml(english)}</p>
            <p class="pronunciation">(${escapeHtml(pronunciation)})</p>
          </article>
        `;
        }).join("");

        return `
          <section class="category-section">
            <h2 class="category-title"><span class="badge">${category.icon}</span>${category.name}</h2>
            <div class="grid">${cards}</div>
          </section>
        `;
      }).join("");

      emptyEl.style.display = total === 0 ? "block" : "none";
      countEl.textContent = `共 ${total} 个单词`;
    }

    function loadVoices() {
      if (!("speechSynthesis" in window)) return;
      const voices = window.speechSynthesis.getVoices();
      englishVoice = voices.find(voice => voice.lang === "en-US")
        || voices.find(voice => voice.lang && voice.lang.toLowerCase().startsWith("en"))
        || null;
      chineseVoice = voices.find(voice => voice.lang === "zh-CN")
        || voices.find(voice => voice.lang && voice.lang.toLowerCase().startsWith("zh"))
        || null;
    }

    function speakText(text, lang, voice, rate = 0.82, pitch = 1.08) {
      if (!("speechSynthesis" in window)) {
        alert("当前浏览器不支持语音朗读功能。");
        return;
      }

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang;
      utterance.rate = rate;
      utterance.pitch = pitch;
      utterance.volume = 1;
      if (voice) utterance.voice = voice;

      window.speechSynthesis.cancel();
      window.speechSynthesis.resume();
      window.speechSynthesis.speak(utterance);
    }

    function speakWord(english) {
      speakText(getSpeakText(english), "en-US", englishVoice, 0.82, 1.08);
    }

    function speakChinese(chinese) {
      speakText(chinese, "zh-CN", chineseVoice, 0.9, 1.04);
    }

    function renderStudyCard(direction = 0) {
      const word = visibleWords[currentStudyIndex];
      if (!word) return;

      studyCard.classList.remove("slide-next", "slide-prev");
      studyPanel.style.background = word.color;
      studyArtEmoji.textContent = getWordEmoji(word);
      studyArtLabel.textContent = getSpeakText(word.english);
      studyCategory.textContent = `${word.icon} ${word.category}`;
      studyChinese.textContent = word.chinese;
      studyEnglish.textContent = word.english;
      studyPronunciation.textContent = `(${word.pronunciation})`;
      studyCount.textContent = `${currentStudyIndex + 1} / ${visibleWords.length}`;

      if (direction !== 0) {
        void studyCard.offsetWidth;
        studyCard.classList.add(direction > 0 ? "slide-next" : "slide-prev");
      }
    }

    function openStudyCard(index) {
      if (!visibleWords[index]) return;
      currentStudyIndex = index;
      renderStudyCard();
      studyModal.classList.add("open");
      studyModal.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      speakWord(visibleWords[currentStudyIndex].english);
    }

    function closeStudyCard() {
      studyModal.classList.remove("open");
      studyModal.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    }

    function showStudyWord(step) {
      if (!visibleWords.length) return;
      currentStudyIndex = (currentStudyIndex + step + visibleWords.length) % visibleWords.length;
      renderStudyCard(step);
      speakWord(visibleWords[currentStudyIndex].english);
    }

      if (!button) return;
      state.selectedCategory = button.dataset.category;
      renderWords();

      const button = event.target.closest(".speak-btn");

        speakWord(button.dataset.word);
        return;

      const card = event.target.closest(".card");
      if (!card) return;
      openStudyCard(Number(card.dataset.index));

    });

    studySpeakChinese.addEventListener("click", () => {
      const word = visibleWords[currentStudyIndex];
      if (word) speakChinese(word.chinese);
    });

    studyPrev.addEventListener("click", () => showStudyWord(-1));
    studyNext.addEventListener("click", () => showStudyWord(1));
    studyClose.addEventListener("click", closeStudyCard);

    studyModal.addEventListener("click", event => {
      if (event.target === studyModal) closeStudyCard();
    });

    studyPanel.addEventListener("touchstart", event => {
      const touch = event.changedTouches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
    }, { passive: true });

    studyPanel.addEventListener("touchend", event => {
      const touch = event.changedTouches[0];
      const deltaX = touch.clientX - touchStartX;
      const deltaY = touch.clientY - touchStartY;

      if (Math.abs(deltaX) < 48 || Math.abs(deltaX) < Math.abs(deltaY) * 1.2) return;
      showStudyWord(deltaX < 0 ? 1 : -1);
    }, { passive: true });

    searchInput.addEventListener("input", event => {
      state.query = event.target.value;
      renderWords();
    });

    document.addEventListener("keydown", event => {
      if (!studyModal.classList.contains("open")) return;
      if (event.key === "Escape") closeStudyCard();
      if (event.key === "ArrowLeft") showStudyWord(-1);
      if (event.key === "ArrowRight") showStudyWord(1);
    });

    if ("speechSynthesis" in window) {
      loadVoices();
      window.speechSynthesis.addEventListener("voiceschanged", loadVoices);
    }

    document.addEventListener("DOMContentLoaded", renderWords);
  </script>
</body>
</html>
